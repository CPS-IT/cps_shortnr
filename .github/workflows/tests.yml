name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # composer.json allows ^8.2: every supported minor must at least parse and pass the suite
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Lint
        run: find Classes Tests ext_localconf.php ext_emconf.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Install
        run: composer update --no-interaction --no-progress

      - name: Integration tests (SQLite)
        run: .Build/bin/phpunit --no-coverage
